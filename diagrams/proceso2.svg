f" stroke="#46a046" stroke-width="3"/><rect class="blue" x="242.0" y="100.0" width="196" height="46" rx="8"/><text class="blue-t" x="340" text-anchor="middle"><tspan x="340" y="114.5" dominant-baseline="central">Identificar necesidad</tspan><tspan x="340" y="131.5" dominant-baseline="central">de cambio</tspan></text><rect class="blue" x="505.0" y="100.0" width="190" height="46" rx="8"/><text class="blue-t" x="600" text-anchor="middle"><tspan x="600" y="114.5" dominant-baseline="central">Registrar solicitud</tspan><tspan x="600" y="131.5" dominant-baseline="central">de cambio</tspan></text><path class="arw" d="M183,123 L241,123" marker-end="url(#ah)"/><path class="arw" d="M438,123 L504,123" marker-end="url(#ah)"/><path class="arw" d="M600,146 L600,175 L380,175 L380,228" marker-end="url(#ah)"/><rect class="blue" x="285.0" y="229.0" width="190" height="46" rx="8"/><text class="blue-t" x="380" text-anchor="middle"><tspan x="380" y="243.5" dominant-baseline="central">Evaluar impacto</tspan><tspan x="380" y="260.5" dominant-baseline="central">y prioridad</tspan></text><path class="arw" d="M380,275 L380,294" marker-end="url(#ah)"/><polygon class="dec" points="380,294 446,332 380,370 314,332"/><text class="dec-t" x="380" text-anchor="middle"><tspan x="380" y="332.0" dominant-baseline="central">¿Comité?</tspan></text><path class="arw" d="M446,332 L610,332" marker-end="url(#ah)"/><text class="brl" x="520" y="323">No</text><rect class="green" x="610.0" y="309.0" width="190" height="46" rx="8"/><text class="green-t" x="705" text-anchor="middle"><tspan x="705" y="323.5" dominant-baseline="central">Proceder</tspan><tspan x="705" y="340.5" dominant-baseline="central">directamente</tspan></text><path class="arw" d="M380,370 L380,382" marker-end="url(#ah)"/><text class="brl" x="390" y="378">Sí</text><polygon class="dec" points="380,382 450,420 380,458 310,420"/><text class="dec-t" x="380" text-anchor="middle"><tspan x="380" y="420.0" dominant-baseline="central">¿Aprobado?</tspan></t